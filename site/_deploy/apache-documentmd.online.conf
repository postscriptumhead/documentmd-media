# Если на сервере Apache вместо nginx: /etc/apache2/sites-available/documentmd.online.conf
# sudo a2ensite documentmd.online && sudo systemctl reload apache2
# sudo certbot --apache -d documentmd.online -d www.documentmd.online
<VirtualHost *:80>
    ServerName documentmd.online
    ServerAlias www.documentmd.online
    DocumentRoot /var/www/documentmd.online
    ErrorDocument 404 /404.html
    <Directory /var/www/documentmd.online>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/documentmd.error.log
    CustomLog ${APACHE_LOG_DIR}/documentmd.access.log combined
</VirtualHost>
