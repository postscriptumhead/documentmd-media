# /etc/nginx/sites-available/documentmd.online
# Второй сайт на том же сервере: nginx выбирает сайт по домену (server_name).
# После включения: sudo ln -s /etc/nginx/sites-available/documentmd.online /etc/nginx/sites-enabled/
#                  sudo nginx -t && sudo systemctl reload nginx
#                  sudo certbot --nginx -d documentmd.online -d www.documentmd.online
server {
    listen 80;
    listen [::]:80;
    server_name documentmd.online www.documentmd.online;

    root /var/www/documentmd.online;
    index index.html;


    location / { try_files $uri $uri/ =404; }
    error_page 404 /404.html;

    location ~* \.(woff|woff2|css|js|svg|png|jpg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml text/plain application/xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; frame-ancestors 'self'" always;

    # журналы: хранение задаётся в logrotate (согласовано с политикой конфиденциальности)
    access_log /var/log/nginx/documentmd.access.log;
    error_log  /var/log/nginx/documentmd.error.log;
}
